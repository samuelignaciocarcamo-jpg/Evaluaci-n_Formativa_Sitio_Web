    <title>Ejemplo de JavaScript</title>
    <script>
        // Código Java Script
        function apagarAmpolleta() {
            document.getElementById("apagada").style.display = "block";
            document.getElementById("encendida").style.display = "none";
        }

        function encenderAmpolleta() {
            document.getElementById("encendida").style.display = "block";
            document.getElementById("apagada").style.display = "none";
        }
    </script>
</head>
<body>
    <h1 style="text-align: center;">Ejemplo de JavaScript</h1>
    <div style="display: flex; justify-content: center; align-items: center;">
        <img id="apagada" src="../img/apagada.jpg" alt="Imagen apagada" style="max-width: 100%; height: auto; max-height: 300px;">
        <img id="encendida" src="../img/encendida.jpg" alt="Imagen encendida" style="max-width: 100%; height: auto; max-height: 300px; display: none;">
    </div>
    <div style="display: flex; justify-content: center; align-items: center; margin-top: 20px;">
        <button style="margin: 10px;" onclick="apagarAmpolleta()">apagar ampolleta</button>
        <button style="margin: 10px;" onclick="encenderAmpolleta()">Encender ampolleta</button>
    </div>
</body>
